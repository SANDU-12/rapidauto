<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Rapid Auto Service Center</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page-hero">
  <div class="page-hero-inner">
    <div class="crumbs"><a href="index.html">Home</a> / Reset Password</div>
    <h1>Reset Your Password</h1>
    <p>Choose a new password for your account.</p>
  </div>
</div>

<section>
  <div class="card" style="max-width:440px;margin:0 auto;">
    <div id="resetBody">
      <div class="field"><label>New Password</label><input id="newPass" type="password" placeholder="At least 6 characters"></div>
      <div class="field"><label>Confirm New Password</label><input id="newPass2" type="password" placeholder="Re-enter password"></div>
      <button class="btn btn-primary" style="width:100%;" onclick="doReset()">Reset Password</button>
    </div>
  </div>
</section>

<script src="app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const resetToken = params.get('token');
if(!resetToken){
  document.getElementById('resetBody').innerHTML = '<p style="color:#dc2626;">No reset token found in the link. Please use the link from your password reset request.</p>';
}
async function doReset(){
  const p1 = document.getElementById('newPass').value;
  const p2 = document.getElementById('newPass2').value;
  if(p1.length < 6){ alert('Password must be at least 6 characters.'); return; }
  if(p1 !== p2){ alert('Passwords do not match.'); return; }
  await apiReady;
  if(!LIVE){ alert('Connect the PHP backend (WAMP) to reset your password.'); return; }
  try{
    const res = await api('/auth.php?action=reset', { method:'POST', body:{ token: resetToken, newPassword: p1 } });
    document.getElementById('resetBody').innerHTML = `<p style="color:var(--success);font-weight:600;">${res.message}</p><a href="index.html" class="btn btn-primary" style="margin-top:14px;display:inline-block;">Return to Home</a>`;
  }catch(e){ alert(e.message); }
}
</script>
</body>
</html>
