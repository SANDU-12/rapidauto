<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spare Parts & Accessories — Rapid Auto Service Center</title>
<link rel="stylesheet" href="styles.css">
<style>
.shop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
@media(max-width:1000px){.shop-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.shop-grid{grid-template-columns:1fr;}}
.prod-card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:.25s;display:flex;flex-direction:column;}
.prod-card:hover{transform:translateY(-6px);box-shadow:0 14px 30px rgba(15,23,42,.08);}
.prod-card img{width:100%;aspect-ratio:4/3;object-fit:cover;}
.prod-body{padding:14px;display:flex;flex-direction:column;flex:1;}
.prod-cat{font-size:10px;font-weight:800;color:var(--secondary);background:#eff6ff;padding:2px 8px;border-radius:20px;width:fit-content;margin-bottom:6px;}
.prod-body b{font-size:14px;margin-bottom:6px;line-height:1.3;}
.prod-price{font-size:17px;font-weight:800;color:var(--primary);margin-bottom:10px;}
.qty-row{display:flex;align-items:center;gap:8px;margin-top:auto;}
.qty-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:#fff;font-weight:700;font-size:16px;}
.qty-val{width:32px;text-align:center;font-weight:700;font-size:14px;}
.add-btn{width:100%;margin-top:10px;padding:9px;border-radius:8px;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:13px;}
.add-btn.added{background:var(--success);}
</style>
</head>
<body>
<div class="page-hero">
  <div class="page-hero-inner">
    <div class="crumbs"><a href="index.html">Home</a> / Spare Parts</div>
    <h1>Vehicle Spare Parts & Accessories</h1>
    <p>Browse genuine parts and detailing products - add to cart and check out online.</p>
  </div>
</div>

<section>
  <div class="category-tabs" id="catTabs"></div>
  <div class="shop-grid" id="shopGrid"></div>
</section>

<script src="app.js"></script>
<script>
let activeCat = "All";
let LIVE_PRODUCTS = null;
const LOCAL_PRODUCT_IMAGES = {
  p1: 'images/eng oil.webp',
  p2: 'images/brake pads.jpg',
  p3: 'images/battery.webp',
  p4: 'images/air.webp',
  p5: 'images/wiper.webp',
  p6: 'images/spark.webp',
  p7: 'images/polish.webp',
  p8: 'images/micro.webp',
  p9: 'images/head.webp',
  p10: 'images/tcleaner.webp',
  p11: 'images/cabin.webp',
  p12: 'images/mats.webp'
};
async function loadProducts(){
  await apiReady;
  if(LIVE){
    try{ LIVE_PRODUCTS = await api('/products.php'); }
    catch(e){ console.warn('Falling back to demo products:', e.message); }
  }
}
function currentProducts(){ return LIVE_PRODUCTS || PRODUCTS; }
function prodCats(){ return ["All", ...new Set(currentProducts().map(p=>p.category||p.cat))]; }
function renderTabs(){
  document.getElementById('catTabs').innerHTML = prodCats().map(c=>
    `<button class="cat-tab ${c===activeCat?'on':''}" onclick="setCat('${c}')">${c}</button>`).join('');
}
function setCat(c){ activeCat=c; renderTabs(); renderShop(); }
function renderShop(){
  const list = activeCat==="All" ? currentProducts() : currentProducts().filter(p=>(p.category||p.cat)===activeCat);
  document.getElementById('shopGrid').innerHTML = list.map((p,i)=>{
    const id = p.id; const cat = p.category||p.cat;
    const image = p.image || (LIVE_PRODUCTS ? p.img : LOCAL_PRODUCT_IMAGES[id]) || p.img;
    return `
    <div class="prod-card reveal" style="transition-delay:${(i%4)*.05}s">
      <img src="${image}" alt="${p.name}" loading="lazy" onerror="imgFallback(this,'${p.name.replace(/'/g,"")}')">
      <div class="prod-body">
        <span class="prod-cat">${cat}</span>
        <b>${p.name}</b>
        <div class="prod-price">Rs. ${Number(p.price).toLocaleString()}</div>
        <div class="qty-row">
          <button class="qty-btn" onclick="stepQty('${id}',-1)">−</button>
          <span class="qty-val" id="qty-${id}">1</span>
          <button class="qty-btn" onclick="stepQty('${id}',1)">+</button>
        </div>
        <button class="add-btn" id="btn-${id}" onclick="addProd('${id}')">Add to Cart</button>
      </div>
    </div>`;
  }).join('');
  setTimeout(initReveal, 30);
}
const localQty = {};
function stepQty(id, d){
  localQty[id] = Math.max(1, (localQty[id]||1) + d);
  document.getElementById('qty-'+id).textContent = localQty[id];
}
function addProd(id){
  addToCart(id, localQty[id]||1);
  const btn = document.getElementById('btn-'+id);
  btn.textContent = '✓ Added'; btn.classList.add('added');
  setTimeout(()=>{ btn.textContent='Add to Cart'; btn.classList.remove('added'); }, 1200);
}
(async ()=>{ await loadProducts(); renderTabs(); renderShop(); })();
</script>
</body>
</html>
